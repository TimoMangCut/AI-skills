[analysis]
output_dir = "documents"
work_dir = ".localsec"
ignored_dirs = [".git", ".hg", ".svn", "bin", "obj", "vendor", "node_modules", ".venv", "venv", "dist", "build", "coverage", "TestResults", ".idea", ".vscode", ".dart_tool", "Pods", ".gradle", "DerivedData"]
max_file_bytes = 2000000
max_lines_per_read = 180
max_chars_per_read = 18000
max_dir_entries = 150
max_dir_calls_per_skill = 15
max_read_calls_per_skill = 25
max_total_tool_calls_per_skill = 40
max_model_turns_per_skill = 45
max_evidence_context_records = 55
max_evidence_excerpt_chars = 1800
max_audit_excerpt_chars = 4500
max_context_chars = 60000
audit_batch_size = 15
max_audit_batches = 6
max_claims_per_audit = 90
validation_retries = 1

[llm]
# OpenAI-compatible local endpoint. Ollama default: http://127.0.0.1:11434/v1
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5-coder:14b"
timeout_seconds = 180
max_tokens = 7000
temperature = 0.0
allow_remote = false
